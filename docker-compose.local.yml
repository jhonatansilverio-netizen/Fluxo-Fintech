# docker-compose.local.yml — Build local (sem precisar do GHCR)
# Uso:
#   docker compose -f docker-compose.local.yml up -d --build
#
# Útil para desenvolvimento e para validar o Dockerfile antes de subir.

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    image: fluxo-fintech:local
    container_name: fluxo-fintech-local
    restart: unless-stopped
    ports:
      - "8080:80"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost/"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s