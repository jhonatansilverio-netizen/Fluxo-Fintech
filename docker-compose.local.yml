# docker-compose.local.yml — Alias do compose principal para builds locais.
# Uso:
#   docker compose -f docker-compose.local.yml up -d --build
#
# É equivalente ao `docker-compose.yml` padrão. Foi mantido apenas por
# compatibilidade com quem já usa esse nome nos comandos.

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    image: fluxo-fintech:local
    container_name: fluxo-fintech-local
    restart: unless-stopped
    ports:
      - "8080:80"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost/"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s