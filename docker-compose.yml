# docker-compose.yml — Fluxo Fintech (build local)
# Uso:
#   docker compose up -d --build   # builda e sobe em background
#   docker compose logs -f         # acompanha logs
#   docker compose down            # para e remove
#
# Por padrão, este compose faz build local a partir do Dockerfile.
# Para puxar a imagem pronta do GHCR (a mesma publicada pelo CI), use:
#   docker compose -f docker-compose.ghcr.yml up -d

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    image: fluxo-fintech:local
    container_name: fluxo-fintech
    restart: unless-stopped
    ports:
      - "8080:80"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost/"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s