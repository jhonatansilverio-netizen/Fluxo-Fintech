server {
    listen       80;
    listen  [::]:80;
    server_name  _;

    root   /usr/share/nginx/html;
    index  index.html;

    # Compressão gzip
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml application/javascript application/json image/svg+xml;

    # Cache agressivo para assets com hash (Vite já gera nomes com hash)
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Favicon e outros estáticos do /public
    location = /favicon.svg {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # SPA fallback — index.html para qualquer rota não encontrada
    location / {
        try_files $uri $uri/ /index.html;
    }
}